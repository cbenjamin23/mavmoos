name: MAVMOOS local-compatible qualification

# Local source definition only. No push, PR, schedule or deployment trigger.
# A future repository owner may explicitly dispatch after provisioning a
# trusted Linux runner and source dependency checkouts.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Qualification tier
        type: choice
        required: true
        default: software
        options: [software, smoke, full]
      moos_source:
        description: Existing pinned MOOS-IvP source checkout on the trusted runner
        type: string
        required: true
      uav_source:
        description: Existing pinned UAV behavior source checkout on the trusted runner
        type: string
        required: true
      ardupilot_source:
        description: Existing ArduPilot object source for native tiers
        type: string
        required: false
      firmware_manifest:
        description: Manifest within this source snapshot
        type: string
        default: config/firmware/arducopter-dev-04cf6486-quad.json
        required: false

permissions:
  contents: read

concurrency:
  group: mavmoos-qualification-${{ github.ref }}-${{ inputs.tier }}
  cancel-in-progress: false

jobs:
  qualification:
    runs-on: [self-hosted, linux, mavmoos-ci]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-built isolated local qualification
        env:
          MAVMOOS_CI_TIER: ${{ inputs.tier }}
          MAVMOOS_CI_MOOS_SOURCE: ${{ inputs.moos_source }}
          MAVMOOS_CI_UAV_SOURCE: ${{ inputs.uav_source }}
          MAVMOOS_CI_ARDUPILOT_SOURCE: ${{ inputs.ardupilot_source }}
          MAVMOOS_CI_MANIFEST: ${{ inputs.firmware_manifest }}
          MAVMOOS_CI_REF: ${{ github.sha }}
          MAVMOOS_CI_OUTPUT: ${{ runner.temp }}/mavmoos-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          command = [sys.executable, '-B', 'scripts/ci/linux.py',
                     '--tier', os.environ['MAVMOOS_CI_TIER'],
                     '--moos-source', os.environ['MAVMOOS_CI_MOOS_SOURCE'],
                     '--uav-source', os.environ['MAVMOOS_CI_UAV_SOURCE'],
                     '--source-ref', os.environ['MAVMOOS_CI_REF'],
                     '--output', os.environ['MAVMOOS_CI_OUTPUT']]
          if os.environ['MAVMOOS_CI_TIER'] != 'software':
              command += ['--ardupilot-source', os.environ['MAVMOOS_CI_ARDUPILOT_SOURCE'],
                          '--firmware-manifest', os.environ['MAVMOOS_CI_MANIFEST']]
          subprocess.run(command, check=True)
          PY
      - name: Retain qualification and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mavmoos-${{ inputs.tier }}-${{ github.sha }}
          path: ${{ runner.temp }}/mavmoos-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
